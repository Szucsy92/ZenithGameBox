name: Aláírt Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.13'
      - name: Android licencek elfogadása
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Android eszközök ellenőrzése
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bun
        uses: oven-sh/setup-bun@v2
      - name: Offline játékkonzol becsomagolása
        env:
          ZENITH_OFFLINE: '1'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile || bun install
          bunx vite build
          # A nitro a buildet .output/public-ba (nem dist/client-be) írja:
          # megkeressük a mappát, ahol az index.html van
          OUT=""
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then
            echo "::error::Nem található index.html a build után"
            ls -la . dist .output .output/public 2>/dev/null || true
            exit 1
          fi
          echo "Build kimenet: $OUT"
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r "$OUT" android/app/src/main/assets/web
          rm -f android/app/src/main/assets/web/_headers
      - name: Kiadási szabályok ellenőrzése
        run: python3 scripts/test_android_release.py
      - name: Indítókép és színek
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.3.2'
          python3 scripts/android-branding.py
      - name: Dátum és verzió
        id: identity
        run: python3 scripts/android-release.py
      - name: Aláírás előkészítése
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Hiányzó GitHub aláírási titok: $name. Lásd android/README.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenith-release.jks"
      - name: Aláírt APK készítése
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenith-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.identity.outputs.version_name }}
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Aláírás és ellenőrző összeg
        env:
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          APK_NAME: ${{ steps.identity.outputs.filename }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/release/$APK_NAME" > "$RUNNER_TEMP/signature.txt"
          actual=$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$expected" ]; then
            echo '::error::Az APK aláírója nem egyezik a beállított tanúsítvánnyal.'
            exit 1
          fi
          (cd "$RUNNER_TEMP/release" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
      - name: Dátumozott kiadás közzététele
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          APK_NAME: ${{ steps.identity.outputs.filename }}
          VERSION: ${{ steps.identity.outputs.version_name }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Aláírt Zenith GameBox Android-kiadás.
          Készítés (UTC): $VERSION
          Forrás: $BUILT_SHA
          A teljes játékkonzol a telefonra települ, internet nélkül is működik.
          Android 7.0 vagy újabb rendszer és naprakész Android System WebView szükséges.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/release/$APK_NAME" "$RUNNER_TEMP/release/$APK_NAME.sha256" --draft --target "$BUILT_SHA" --title "Zenith GameBox – $VERSION (UTC)" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --draft=false --latest
          printf '### Letölthető Android-kiadás\n\n[%s](%s/%s/releases/tag/%s)\n' "$APK_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Aláírási fájlok törlése
        if: always()
        run: rm -f "$RUNNER_TEMP/zenith-release.jks" "$RUNNER_TEMP/signature.txt"
